# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "67beb1794fab10553102c134b63e1277"
name = "CARTGAIN"
description = "Recover abandoned carts with WhatsApp, Email and SMS — plus AI price negotiation at checkout that converts bargain hunters into buyers."
application_url = "https://cart-gain.com/api/shopify/install"
embedded = true
# handle = "cartgain"  # linked via client_id; omitted to avoid branding validation bug

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/api/webhooks/shopify"
  topics = [
  "carts/update",
  "checkouts/create",
  "checkouts/update",
  "orders/create"
]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_checkouts,read_checkouts,read_customers,write_customers,read_discounts,write_discounts,write_draft_orders,read_draft_orders,read_orders,write_orders,read_products,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://cart-gain.com/api/shopify/callback" ]
