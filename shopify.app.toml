# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "67beb1794fab10553102c134b63e1277"
name = "CARTGAIN"
description = "Recover abandoned carts with WhatsApp, Email and SMS — plus AI price negotiation at checkout that converts bargain hunters into buyers."
application_url = "https://cart-gain.com/api/shopify/install"
embedded = true
# handle = "cartgain"  # linked via client_id; omitted to avoid branding validation bug
# Privacy URL + ToS are surfaced to Shopify reviewers for the protected-customer-data
# review. They were previously listed here, but Shopify CLI >= 4.8 rejects
# privacy_policy_url / tos_url in app.toml; they now live in the Partner Dashboard.

[webhooks]
# Functional topics, declared with `topics`.
#
# The three MANDATORY compliance topics are declared separately below with
# `compliance_topics` (not `topics` — the key is different, which is why an
# earlier version of this file claimed they "could not be re-declared in
# app.toml" and left them out entirely). Shopify's automated pre-submission
# check reads these from the app config, and the Partner Dashboard no longer
# exposes an input for them: config TOML + `shopify app deploy` is the only
# registration path. Missing them fails
#   - "Provides mandatory compliance webhooks"
#   - "Verifies webhooks with HMAC signatures" (no registered endpoint to test)
# Declaring them here is additive — src/lib/shopify.ts still registers all three
# at install via the Admin API, and both paths point at the same handler, so a
# merchant gets identical behaviour whichever applies.
api_version = "2026-04"

# Webhook URIs below are ABSOLUTE on purpose. Shopify resolves a relative
# webhook `uri` against `application_url`, and application_url below is a
# subpath ("/api/shopify/install"). A relative "/api/webhooks/shopify" therefore
# resolved to "/api/shopify/install/api/webhooks/shopify" and every
# config-declared delivery 404'd — which is what failed the automated
# "Verifies webhooks with HMAC signatures" check. Absolute HTTPS URLs are
# supported and are resolved verbatim.

  [[webhooks.subscriptions]]
  uri = "https://cart-gain.com/api/webhooks/shopify"
  topics = [
  "carts/update",
  "checkouts/create",
  "checkouts/update",
  "orders/create",
  # Revenue netting — Day 8-10: refunded/cancelled recoveries are netted out of
  # recognized revenue (see src/lib/attribution.ts).
  "orders/cancelled",
  "refunds/create",
  "app/uninstalled",
  "app_subscriptions/update"
]

  # customers/data_request — data subject access request
  # customers/redact      — delete a customer's data
  # shop/redact           — delete a shop's data (48h after uninstall)
  [[webhooks.subscriptions]]
  uri = "https://cart-gain.com/api/webhooks/shopify"
  compliance_topics = [
  "customers/data_request",
  "customers/redact",
  "shop/redact"
]

[access_scopes]
# Minimum necessary access — kept in sync with the runtime OAuth request in
# src/app/api/shopify/connect/route.ts. CartGain does not write customers,
# orders, products, or draft orders, so those write scopes are intentionally
# not requested (see SHOPIFY_PROTECTED_DATA_READINESS.md).
# read_webhooks / write_webhooks are omitted: Shopify deprecated those scopes
# and webhook management is implicit for the app.
scopes = "read_checkouts,write_checkouts,read_orders,read_all_orders,read_customers,read_products,read_product_listings,read_discounts,write_discounts"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://cart-gain.com/api/shopify/callback" ]
