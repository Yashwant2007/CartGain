name: Process abandoned carts

# Vercel Hobby does not allow sub-daily cron jobs, so the recovery job is
# driven from GitHub Actions instead. It hits the same authenticated endpoint
# Vercel Cron would (the route accepts `Authorization: Bearer $JOB_SECRET`).
# Requires the repository secret `JOB_SECRET` to match the production env var
# of the same name.
#
# GET also pulls the store's abandoned checkouts from Shopify before running
# the sends, so carts still flow even if the webhook subscription is missing.
#
# Note: GitHub schedules run at best every ~5 minutes (often a few minutes
# late) and are disabled after 60 days without repository activity.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: process-carts
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Sync abandoned checkouts and run the recovery sweep
        env:
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
        run: |
          if [ -z "$JOB_SECRET" ]; then
            echo "::error::Repository secret JOB_SECRET is not set - cart recovery cannot run."
            exit 1
          fi
          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            https://cart-gain.com/api/jobs/process-carts \
            -H "Authorization: Bearer ${JOB_SECRET}" \
            --max-time 60)
          echo "HTTP ${status}"
          cat /tmp/response.json || true
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Cart-processing sweep failed with HTTP ${status}"
            exit 1
          fi
