name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `prisma generate` refuses to run without a datasource url — the schema
    # uses env("DATABASE_URL") / env("DIRECT_URL"). CI has no database
    # credentials, so without these the generated client stays the untyped
    # stub shipped by @prisma/client and every prisma.* call fails to
    # typecheck (no exported members, "untyped function calls may not accept
    # type arguments"). The values are never dialled — generate only needs
    # them to be present and well formed.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/cartgain?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/cartgain?schema=public

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Generate the client explicitly instead of relying on the
      # @prisma/client postinstall hook, which silently keeps the stub when
      # generation fails.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest --ci

      - name: Production build
        run: npm run build

      - name: Verify no secrets tracked
        run: |
          if git ls-files | grep -qE '(^|/)(\.env(\.local)?|credentials)(/|$)' ; then
            echo "❌ Secret/environment files are tracked in git."; exit 1
          fi
          echo "✅ No secret files tracked."