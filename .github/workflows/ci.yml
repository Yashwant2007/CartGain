name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest --ci

      - name: Production build
        run: npm run build

      - name: Verify no secrets tracked
        run: |
          if git ls-files | grep -qE '(^|/)(\.env(\.local)?|credentials)(/|$)' ; then
            echo "❌ Secret/environment files are tracked in git."; exit 1
          fi
          echo "✅ No secret files tracked."